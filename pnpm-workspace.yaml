allowBuilds:
  esbuild: true
  # wrangler's runtime (the D1 Worker in api/) — a native binary, built on install
  workerd: true
minimumReleaseAgeExclude:
  # First-party — we publish these; the release-age delay guards the third-party
  # supply chain, and a per-version list had to be appended on every bump
  # (kol-fxr's line, taken 2026-10-15 after the kol-icons 0.38.0 bump blocked `pnpm dev`).
  - '@kolkrabbi/*'
  - 'globals@17.11.0'
